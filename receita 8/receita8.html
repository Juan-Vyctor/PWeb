<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
	</head>
	<body style="font-family: Arial, sans-serif; text-align: center">
		<h1>Dinossauros Extintos</h1>
		<div style="margin-bottom: 20px">
			<button
				id="botaoCarregar"
				style="padding: 10px 20px; font-size: 16px; cursor: pointer"
			>
				Carregar dinossauro
			</button>
		</div>
		<div
			id="dinossauroDiv"
			style="
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
			"
		></div>
		<a style="display: block; margin-top: 20px" href="../index.html">
			Voltar
		</a>
	</body>
	<script src="funcoes.js"></script>
	<script>
		let dinossauro = [];

		function carregarDinossauro2() {
			fetch("https://extinct-api.herokuapp.com/api/v1/animal/")
				.then((res) => res.json())
				.then((json) => {
					dinossauro = json.data;
					carregarDiv(dinossauro);
				})
				.catch(
					(err) =>
						(document.getElementById("dinossauroDiv").innerHTML =
							`Erro ao carregar dinossauro: ${err}`),
				);
			document.getElementById("dinossauroDiv").innerHTML =
				`Fazendo requisição`;
		}

		let botao = document.getElementById("botaoCarregar");
		botao.addEventListener("click", () => carregarDinossauro2());
	</script>
</html>

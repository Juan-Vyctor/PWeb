<html>
	<head>
		<meta charset="UTF-8" />
		<title>ReceitaReact - 2</title>
	</head>

	<body>
		<div id="app"></div>
		<script src="../libs/react.js"></script>
		<script src="../libs/react-dom.js"></script>
		<script src="../libs/babel.js"></script>

		<script type="text/babel">
			class TabelaBebidas extends React.Component {
				constructor(props) {
					super(props);
				}

				render() {
					let { titulo } = this.props;
					return (
						<div>
							<h1>{titulo}</h1>
							<table id="tabela" border="1">
								<thead>
									<tr>
										<th>Nome</th>
										<th>Marca</th>
									</tr>
								</thead>

								<tbody>
									<tr>
										<td>Havana</td>
										<td>Engenho Anísio Santiago</td>
									</tr>
								</tbody>
							</table>
							<a href="../../../index.html">Voltar</a>
						</div>
					);
				}
			}

			ReactDOM.render(
				<TabelaBebidas titulo="Padaria" />,
				document.getElementById("app"),
			);
		</script>
	</body>
</html>

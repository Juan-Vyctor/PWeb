<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
	</head>
	<body>
		<div>
			<button id="botaoCarregar">Carregando cervejas...</button>
		</div>
		<div id="cervejasDiv"></div>
		<a style="display: block" href="../index.html">Voltar</a>
	</body>
	<script>
		let cervejas = [
			{
				name: "Guiness",
				alcohol: "10%",
				style: "Imperial Stout",
				ibu: "40",
			},
			{
				name: "Desperados",
				alcohol: "6%",
				style: "Lager",
				ibu: "25",
			},
			{
				name: "Becks",
				alcohol: "5%",
				style: "Pilsen",
				ibu: "20",
			},
		];
		// cs é um array de cervejas
		const carregarDiv = (
			cs,
			id = "cervejasDiv",
			cabecalhos = ["Nome", "Álcool", "Estilo", "Amargor"],
			propriedades = ["name", "alcohol", "style", "ibu"],
		) => {
			const div = document.getElementById(id);

			const cabecalhosHtml = cabecalhos.map(
				(item) => `
					<th
						style="
							border: 1px solid black;
							padding: 10px;
							background-color: lightgray;
						"
					>
						${item}
					</th>
				`,
			);

			const itensHtml = cs.map(
				(item) => `
					<tr>
						${propriedades
							.map(
								(propriedade) => `
								<td
									style="
										border: 1px solid black;
										padding: 10px;
									"
								>
									${item[propriedade]}
								</td>
							`,
							)
							.join("\n")}
					</tr>
				`,
			);

			div.innerHTML = `
				<table
					style="
						border-collapse: collapse;
						margin-top: 20px;
						text-align: center;
					"
				>
					<tr>
						${cabecalhosHtml.join("\n")}
					</tr>

					${itensHtml.join("\n")}
				</table>
			`;
		};
		let botao = document.getElementById("botaoCarregar");
		botao.addEventListener("click", () => carregarDiv(cervejas));
	</script>
</html>
